<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live RFID Attendance Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 30px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }
    
    .header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #334155; }
    .header h1 { color: #38bdf8; font-size: 28px; margin-bottom: 8px; }
    .header p { color: #94a3b8; font-size: 14px; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
    .live-dot { height: 10px; width: 10px; background-color: #4ade80; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .table-card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.4); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: #334155; color: #38bdf8; padding: 14px 18px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 16px 18px; border-bottom: 1px solid #334155; font-size: 15px; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: rgba(51, 65, 85, 0.2); }
    
    .badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; text-align: center; }
    .badge-present { background-color: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-absent { background-color: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IoT Attendance Dashboard</h1>
      <p>Real-Time Presence Tracker & Log System</p>
    </div>

    <div class="status-bar">
      <span><span class="live-dot"></span>Live Sync Active</span>
      <span id="last-updated">Updating records...</span>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Card UID</th>
            <th>Status</th>
            <th>Last Log Time</th>
          </tr>
        </thead>
        <tbody id="attendance-body">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">Loading student records from database...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- PASTE YOUR FIREBASE DATABASE URL BELOW (Must end with .json) ---
    const DATABASE_URL = "https://rfid-attendance-system-f37d4-default-rtdb.firebaseio.com/.json";

    async function fetchAttendanceData() {
      try {
        const response = await fetch(DATABASE_URL);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        const tbody = document.getElementById('attendance-body');
        const updatedSpan = document.getElementById('last-updated');
        
        updatedSpan.innerText = "Last synced: " + new Date().toLocaleTimeString();

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">No attendance records found yet. Tap an ID card!</td></tr>`;
          return;
        }

        let tableHtml = '';
        
        // Loop through each student card UID stored at the database root[cite: 2]
        for (let key in data) {
          let student = data[key];
          
          // Verify it's a valid student record object
          if (student && typeof student === 'object' && student.name) {
            let isPresent = student.status === "PRESENT" || student.status === "CHECK_IN";
            let badgeClass = isPresent ? "badge-present" : "badge-absent";
            let statusText = isPresent ? "PRESENT" : "ABSENT";
            let timeDisplay = student.timestamp ? student.timestamp : "--:--";
            let uidDisplay = student.uid ? student.uid : key.replace(/_/g, " ");

            tableHtml += `
              <tr>
                <td style="font-weight:600; color:#f8fafc;">${student.name}</td>
                <td style="font-family:monospace; color:#94a3b8;">${uidDisplay}</td>
                <td><span class="badge ${badgeClass}">${statusText}</span></td>
                <td style="color:#94a3b8;">${timeDisplay}</td>
              </tr>`;
          }
        }

        if (tableHtml === '') {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">Waiting for valid student card scans...</td></tr>`;
        } else {
          tbody.innerHTML = tableHtml;
        }

      } catch (error) {
        console.error("Failed to fetch attendance data:", error);
        document.getElementById('attendance-body').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#f87171; padding: 30px;">Error connecting to database. Check network or rules.</td></tr>`;
      }
    }

    // Fetch data immediately when page loads
    fetchAttendanceData();

    // Auto-refresh data every 1 seconds for real-time updates without heavy SDK hooks
    setInterval(fetchAttendanceData, 1000);
  </script>
</body>
</html>
