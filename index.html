<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT RFID Attendance & Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 30px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }
    
    .header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #334155; }
    .header h1 { color: #38bdf8; font-size: 28px; margin-bottom: 8px; }
    .header p { color: #94a3b8; font-size: 14px; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
    .live-dot { height: 10px; width: 10px; background-color: #4ade80; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #4ade80; }

    .card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.4); }
    .card-header { background-color: #334155; color: #38bdf8; padding: 14px 18px; font-size: 14px; font-weight: bold; text-transform: uppercase; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: rgba(15, 23, 42, 0.4); color: #94a3b8; padding: 12px 18px; font-size: 12px; text-transform: uppercase; }
    td { padding: 16px 18px; border-bottom: 1px solid #334155; font-size: 15px; }
    tr:last-child td { border-bottom: none; }
    
    .badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
    .badge-present { background-color: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-absent { background-color: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    /* Admin Form Styling */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; padding: 20px; }
    input { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { background-color: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IoT Attendance Dashboard</h1>
      <p>Dynamic Cloud-Managed Presence Tracker</p>
    </div>

    <div class="status-bar">
      <span><span class="live-dot"></span>Live Sync Active</span>
      <span id="last-updated">Updating records...</span>
    </div>

    <!-- Live Attendance Table -->
    <div class="card">
      <div class="card-header">Live Attendance Log</div>
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Card UID</th>
            <th>Status</th>
            <th>Last Log Time</th>
          </tr>
        </thead>
        <tbody id="attendance-body">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">Loading attendance...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Admin Panel: Add Students Without Code -->
    <div class="card">
      <div class="card-header">Admin Panel: Register New Student</div>
      <div class="form-grid">
        <input type="text" id="studentName" placeholder="Student Full Name">
        <input type="text" id="studentUID" placeholder="Card UID (e.g. A5 5F 29 07)">
        <button onclick="addStudent()">Add Student</button>
      </div>
    </div>
  </div>

  <script>
    // --- YOUR FIREBASE DATABASE URL ---
    const DATABASE_URL = "https://rfid-attendance-system-f37d4-default-rtdb.firebaseio.com/";

    async function fetchAttendance() {
      try {
        const response = await fetch(DATABASE_URL + "attendance.json");
        const data = await response.json();
        const tbody = document.getElementById('attendance-body');
        document.getElementById('last-updated').innerText = "Last synced: " + new Date().toLocaleTimeString();

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">No attendance records found yet.</td></tr>`;
          return;
        }

        let tableHtml = '';
        for (let key in data) {
          let student = data[key];
          if (student && student.name) {
            let isPresent = student.status === "PRESENT" || student.status === "CHECK_IN";
            let badgeClass = isPresent ? "badge-present" : "badge-absent";
            let statusText = isPresent ? "PRESENT" : "ABSENT";

            tableHtml += `
              <tr>
                <td style="font-weight:600;">${student.name}</td>
                <td style="font-family:monospace; color:#94a3b8;">${student.uid}</td>
                <td><span class="badge ${badgeClass}">${statusText}</span></td>
                <td style="color:#94a3b8;">${student.timestamp || '--:--'}</td>
              </tr>`;
          }
        }
        tbody.innerHTML = tableHtml || `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">No records yet.</td></tr>`;
      } catch (err) {
        console.error(err);
      }
    }

    async function addStudent() {
      let name = document.getElementById('studentName').value.trim();
      let uid = document.getElementById('studentUID').value.trim().toUpperCase();

      if (!name || !uid) {
        alert("Please enter both Name and Card UID!");
        return;
      }

      // Format UID for Firebase path (replace spaces with underscores)
      let firebaseKey = uid.replace(/ /g, "_");

      let studentData = {
        name: name,
        uid: uid
      };

      try {
        let response = await fetch(DATABASE_URL + "registered_students/" + firebaseKey + ".json", {
          method: 'PUT',
          body: JSON.stringify(studentData),
          headers: { 'Content-Type': 'application/json' }
        });

        if (response.ok) {
          alert("Student successfully registered in cloud database!");
          document.getElementById('studentName').value = '';
          document.getElementById('studentUID').value = '';
        } else {
          alert("Failed to register student.");
        }
      } catch (err) {
        alert("Error connecting to database.");
      }
    }

    fetchAttendance();
    setInterval(fetchAttendance, 500);
  </script>
</body>
</html>
