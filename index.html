<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT RFID Attendance & Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 30px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 950px; }
    
    .header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #334155; }
    .header h1 { color: #38bdf8; font-size: 28px; margin-bottom: 8px; }
    .header p { color: #94a3b8; font-size: 14px; }
    
    /* Navigation Tabs */
    .nav-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    .tab-btn { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
    .live-dot { height: 10px; width: 10px; background-color: #4ade80; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #4ade80; }

    .card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.4); }
    .card-header { background-color: #334155; color: #38bdf8; padding: 14px 18px; font-size: 14px; font-weight: bold; text-transform: uppercase; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: rgba(15, 23, 42, 0.4); color: #94a3b8; padding: 12px 18px; font-size: 12px; text-transform: uppercase; }
    td { padding: 16px 18px; border-bottom: 1px solid #334155; font-size: 15px; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: rgba(51, 65, 85, 0.2); }
    
    .badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
    .badge-present { background-color: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-absent { background-color: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    /* Admin Form & List Styling */
    .section-content { display: none; }
    .section-content.active { display: block; }
    .form-container { padding: 25px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; text-transform: uppercase; }
    input { width: 100%; background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    
    .action-btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; }
    .action-btn:hover { background-color: #7dd3fc; }
    
    .delete-btn { background-color: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid #f87171; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .delete-btn:hover { background-color: rgba(248, 113, 113, 0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IoT Attendance Dashboard</h1>
      <p>Cloud-Managed RFID System</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('attendance')">Live Attendance</button>
      <button class="tab-btn" onclick="switchTab('admin')">Manage Students (Admin)</button>
    </div>

    <div class="status-bar">
      <span><span class="live-dot"></span>Live Sync Active</span>
      <span id="last-updated">Updating records...</span>
    </div>

    <!-- TAB 1: LIVE ATTENDANCE -->
    <div id="attendance-section" class="section-content active">
      <div class="card">
        <div class="card-header">Attendance Log</div>
        <table>
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Card UID</th>
              <th>Status</th>
              <th>Last Log Time</th>
            </tr>
          </thead>
          <tbody id="attendance-body">
            <tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">Loading attendance...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: ADMIN PANEL -->
    <div id="admin-section" class="section-content">
      <div class="card">
        <div class="card-header">Register New Student</div>
        <div class="form-container">
          <div class="form-group">
            <label>Student Full Name</label>
            <input type="text" id="studentName" placeholder="e.g. Rahul Sharma">
          </div>
          <div class="form-group">
            <label>RFID Card UID (Exact Hex)</label>
            <input type="text" id="studentUID" placeholder="e.g. A5 5F 29 07">
          </div>
          <button class="action-btn" onclick="addStudent()">Add Student to Database</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Registered Students Database</div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Card UID</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="registered-body">
            <tr><td colspan="3" style="text-align:center; color:#94a3b8; padding: 30px;">Loading registered list...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Base Firebase URL (No trailing slash)
    const DATABASE_URL = "https://rfid-attendance-system-f37d4-default-rtdb.firebaseio.com";

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));

      if (tabName === 'attendance') {
        document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('attendance-section').classList.add('active');
        fetchAttendance();
      } else {
        document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('admin-section').classList.add('active');
        fetchRegisteredStudents();
      }
    }

    async function fetchAttendance() {
      try {
        const response = await fetch(DATABASE_URL + "/attendance.json");
        const data = await response.json();
        const tbody = document.getElementById('attendance-body');
        document.getElementById('last-updated').innerText = "Last synced: " + new Date().toLocaleTimeString();

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">No attendance records found yet.</td></tr>`;
          return;
        }

        let tableHtml = '';
        for (let key in data) {
          let student = data[key];
          if (student && student.name) {
            let isPresent = student.status === "PRESENT" || student.status === "CHECK_IN";
            let badgeClass = isPresent ? "badge-present" : "badge-absent";
            let statusText = isPresent ? "CHECK_IN" : "CHECK_OUT";

            tableHtml += `
              <tr>
                <td style="font-weight:600;">${student.name}</td>
                <td style="font-family:monospace; color:#94a3b8;">${student.uid}</td>
                <td><span class="badge ${badgeClass}">${statusText}</span></td>
                <td style="color:#94a3b8;">${student.timestamp || '--:--'}</td>
              </tr>`;
          }
        }
        tbody.innerHTML = tableHtml || `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 30px;">No records yet.</td></tr>`;
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchRegisteredStudents() {
      try {
        const response = await fetch(DATABASE_URL + "/registered_students.json");
        const data = await response.json();
        const tbody = document.getElementById('registered-body');

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding: 30px;">No students registered yet.</td></tr>`;
          return;
        }

        let tableHtml = '';
        for (let key in data) {
          let student = data[key];
          if (student && student.name) {
            tableHtml += `
              <tr>
                <td style="font-weight:600;">${student.name}</td>
                <td style="font-family:monospace; color:#94a3b8;">${student.uid}</td>
                <td><button class="delete-btn" onclick="deleteStudent('${key}')">Remove</button></td>
              </tr>`;
          }
        }
        tbody.innerHTML = tableHtml || `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding: 30px;">No registered students found.</td></tr>`;
      } catch (err) {
        console.error(err);
      }
    }

    async function addStudent() {
      let name = document.getElementById('studentName').value.trim();
      let uid = document.getElementById('studentUID').value.trim().toUpperCase();

      if (!name || !uid) {
        alert("Please enter both Name and Card UID!");
        return;
      }

      let firebaseKey = uid.replace(/\s+/g, "_");
      let studentData = { name: name, uid: uid };

      try {
        let response = await fetch(DATABASE_URL + "/registered_students/" + firebaseKey + ".json", {
          method: 'PUT',
          body: JSON.stringify(studentData),
          headers: { 'Content-Type': 'application/json' }
        });

        if (response.ok) {
          alert("Student successfully registered!");
          document.getElementById('studentName').value = '';
          document.getElementById('studentUID').value = '';
          fetchRegisteredStudents();
        } else {
          alert("Failed to register student.");
        }
      } catch (err) {
        alert("Error connecting to database.");
      }
    }

    async function deleteStudent(firebaseKey) {
      if (!confirm("Are you sure you want to remove this student?")) return;

      try {
        let response = await fetch(DATABASE_URL + "/registered_students/" + firebaseKey + ".json", {
          method: 'DELETE'
        });

        if (response.ok) {
          alert("Student removed successfully.");
          fetchRegisteredStudents();
        } else {
          alert("Failed to delete student.");
        }
      } catch (err) {
        alert("Error connecting to database.");
      }
    }

    fetchAttendance();
    setInterval(fetchAttendance, 1000);
  </script>
</body>
</html>
