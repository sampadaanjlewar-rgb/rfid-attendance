<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live RFID Attendance Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }
    .header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #334155; }
    .header h1 { color: #38bdf8; font-size: 26px; margin-bottom: 5px; }
    .header p { color: #94a3b8; font-size: 14px; }
    
    .table-card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: #334155; color: #38bdf8; padding: 14px 16px; font-size: 14px; text-transform: uppercase; }
    td { padding: 14px 16px; border-bottom: 1px solid #334155; font-size: 15px; }
    tr:last-child td { border-bottom: none; }
    
    .badge { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
    .badge-present { background-color: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid #4ade80; }
    .badge-absent { background-color: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IoT Attendance Dashboard</h1>
      <p>Real-Time Presence Tracker</p>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Card UID</th>
            <th>Status</th>
            <th>Last Log Time</th>
          </tr>
        </thead>
        <tbody id="attendance-body">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8;">Connecting to database...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://rfid-attendance-system-f37d4-default-rtdb.firebaseio.com/" // Keep your Firebase URL here!
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const dbRef = ref(db, 'attendance/');
    onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('attendance-body');
      
      if (!data) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8;">No attendance records found yet. Tap a card!</td></tr>`;
        return;
      }

      let tableHtml = '';
      for (let uid in data) {
        let student = data[uid];
        let isPresent = student.status === "PRESENT";
        let badgeClass = isPresent ? "badge-present" : "badge-absent";
        let timeDisplay = student.timestamp ? student.timestamp : "--:--";

        tableHtml += `
          <tr>
            <td style="font-weight:600;">${student.name}</td>
            <td style="font-family:monospace; color:#94a3b8;">${student.uid}</td>
            <td><span class="badge ${badgeClass}">${student.status}</span></td>
            <td style="color:#94a3b8;">${timeDisplay}</td>
          </tr>`;
      }
      tbody.innerHTML = tableHtml;
    });
  </script>
</body>
</html>
